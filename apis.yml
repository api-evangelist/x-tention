aid: x-tention
name: x-tention
description: 'x-tention Informationstechnologie GmbH is an Austrian healthcare IT company
  headquartered in Wels, Upper Austria, that builds, integrates and operates information
  systems for hospitals, health insurers and social-care providers across Austria, Germany,
  Switzerland and the United Kingdom. Its products centre on healthcare interoperability:
  MACH (Medical Application Connection Hub), a hybrid on-premises and cloud integration
  platform built on the Orchestra health service bus it acquired with soffico GmbH, together
  with MACH Orchestra, MACH Portal, MACH Gateway, MACH MPI, DICOM Routing, a File Streaming
  Channel and HL7 FHIR Templates; an Interoperability Platform covering HL7 v2, IHE, FHIR
  and openEHR; a Clinical Data Platform for the DACH region; a gematik-approved TI-Messenger
  built with Famedly on the Matrix protocol; and cybersecurity services. x-tention publishes
  no public developer portal, API reference or machine-readable API contract: technical
  documentation lives inside the customer-authenticated MACH Portal, so its integration
  surfaces are described in marketing and product literature only.'
