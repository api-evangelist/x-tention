not_conformant:
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth 2.0 authorization server is published. /.well-known/oauth-authorization-server
    returned 404 on x-tention.com and mach.health, and portal.mach.health answers every
    path with the same 62,604-byte Angular shell, so its 200 is not a document.
- id: oidc
  conforms: false
  evidence: >-
    No OpenID Provider metadata. /.well-known/openid-configuration returned 404 on
    x-tention.com and mach.health. The MACH Portal page states it supports SSO
    (https://mach.health/portal), but publishes no discovery document.
- id: rfc9457
  conforms: false
  evidence: No error format is published because no API contract is published.
- id: rfc9116
