  evidence:
    url: https://x-tention.com/en/product/mach
    http_status: 200
    detail: XDT is listed among the supported message formats.
    kind: product-documentation
- id: bpmn
  label: BPMN 2.0 process modelling
  conforms: true
  grade: named
  domain_standard: false
  evidence:
    url: https://mach.health/orchestra
    http_status: 200
    detail: >-
      Orchestra scenarios are modelled in the Designer as "graphical flowcharts using
      BPMN (Business Process Model and Notation)".
    kind: product-documentation
- id: soap
  label: SOAP / WS-* web services
  conforms: true
  grade: named
  domain_standard: false
  evidence:
    url: https://mach.health/orchestra
    http_status: 200
    detail: SOAP Client/Server is listed among Orchestra's standard connectivity adapters.
    kind: product-documentation
  note: >-
    No WSDL is published. https://x-tention.com/?wsdl, https://mach.health/?wsdl and
    https://portal.mach.health/?wsdl all return the ordinary HTML page, not a contract.
- id: rest
  label: REST over HTTP
  conforms: true
  grade: named
  domain_standard: false
  evidence:
    url: https://mach.health/orchestra
    http_status: 200
    detail: >-
      REST Client/Server, HTTP GET Receiver, HTTP POST Receiver and HTTP Caller adapters
      are listed among Orchestra's standard connectivity adapters. These are integration
      adapters a customer configures, not an x-tention-hosted API.
    kind: product-documentation
- id: mtls
  label: Mutual TLS
  conforms: true
  grade: named
  domain_standard: false
  evidence:
