summary: >-
  No .well-known document is served on any x-tention host. Every path returned 404 on
  x-tention.com and mach.health. portal.mach.health returns HTTP 200 for every path,
  including ones that cannot exist — it is an Angular single-page application whose
  catch-all route serves the same 62,604-byte "Loading MACH Portal" shell to every
  request, so none of its 200s is a document and all are recorded as misses.
