control_probes:
- host: portal.mach.health
  path: /.apievangelist-control-probe-does-not-exist-9f2a
  expected: 404
  observed: 200
  body_bytes: 62604
  conclusion: >-
    Confirms the catch-all. A path that cannot exist returns the same 200 shell — byte
    for byte the same length as every /.well-known/* response from this host — so no 200
    from portal.mach.health is evidence of a served document.
- host: x-tention.com
  path: /.apievangelist-control-probe-does-not-exist-9f2a
  expected: 404
  observed: 403
  conclusion: >-
    Apache refuses dot-prefixed paths at the root with 403, but the /.well-known/*
    probes above returned genuine 404s with the site's own error page, so those
    absences are real and not an artefact of the edge policy.
- host: mach.health
